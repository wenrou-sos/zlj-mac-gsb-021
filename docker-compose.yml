services:
  db:
    image: postgres:16-alpine
    container_name: dc-capacity-db
    environment:
      POSTGRES_USER: dcadmin
      POSTGRES_PASSWORD: dcpass
      POSTGRES_DB: dc_capacity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcadmin -d dc_capacity"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: dc-capacity-backend
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: dcadmin
      PGPASSWORD: dcpass
      PGDATABASE: dc_capacity
      SEED_DEMO: "1"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: dc-capacity-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
